# Deploy em PRODUCAO na Netlify a cada push na branch main/master.
# Requer secrets no GitHub do repositorio:
#   NETLIFY_AUTH_TOKEN  -> Personal Access Token (nao use o token da CLI OAuth se der Forbidden)
#   NETLIFY_SITE_ID     -> Site ID em Netlify > Site configuration > General
#
# Criar PAT: https://app.netlify.com/user/applications#personal-access-tokens
# Permissoes: escopo que permita deploy (ex.: "Full access" para testar).

name: Deploy Netlify

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: netlify-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Usa npx para nao depender de tag da action netlify/actions/cli (evita 404 / versao errada).
      - name: Deploy to Netlify (production)
        run: npx --yes netlify-cli@17 deploy --prod --build --skip-functions-cache --message "GitHub Actions ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
