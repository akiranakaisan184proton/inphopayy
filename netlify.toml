[build]
  base = "."
  # backend/ tem better-sqlite3; o bundler das Functions resolve a partir de backend/node_modules.
  command = "npm install && npm --prefix backend install && npm run build:frontend"
  publish = "frontend/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["better-sqlite3"]

[functions."api"]
  included_files = ["backend/src/**"]

[functions."discord-interactions"]
  included_files = ["backend/src/**"]

# Variáveis Discord e canais: configure no painel Netlify (Site settings → Environment variables)
# para os âmbitos "Functions" e "Runtime", ou use: netlify env:set KEY value --context production --force

# All app traffic goes through the api function
[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/api/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/me"
  to = "/.netlify/functions/api/me"
  status = 200
  force = true

[[redirects]]
  from = "/wallet"
  to = "/.netlify/functions/api/wallet"
  status = 200
  force = true

[[redirects]]
  from = "/wallet/*"
  to = "/.netlify/functions/api/wallet/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/transactions"
  to = "/.netlify/functions/api/transactions"
  status = 200
  force = true

[[redirects]]
  from = "/checkout-links"
  to = "/.netlify/functions/api/checkout-links"
  status = 200
  force = true

[[redirects]]
  from = "/checkout-links/*"
  to = "/.netlify/functions/api/checkout-links/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-keys"
  to = "/.netlify/functions/api/api-keys"
  status = 200
  force = true

[[redirects]]
  from = "/api-keys/*"
  to = "/.netlify/functions/api/api-keys/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/pix/*"
  to = "/.netlify/functions/api/pix/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/public/*"
  to = "/.netlify/functions/api/public/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/checkout/*"
  to = "/.netlify/functions/api/checkout/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[[redirects]]
  from = "/withdrawals"
  to = "/.netlify/functions/api/withdrawals"
  status = 200
  force = true

[[redirects]]
  from = "/withdrawals/*"
  to = "/.netlify/functions/api/withdrawals/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/discord/interactions"
  to = "/.netlify/functions/discord-interactions"
  status = 200
  force = true

# SPA fallback - must be the last redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
